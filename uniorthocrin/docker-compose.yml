services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniorthocrin-app
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "composer install &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniorthocrin-vite
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -lc "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173"

  db:
    image: mysql:8.4
    container_name: uniorthocrin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:
